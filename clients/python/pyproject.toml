[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cairn-db"
version = "0.3.1"
description = "Client for Cairn, the hybrid search database where a deletion is final"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3"]

keywords = ["cairn", "vector-search", "hybrid-search", "rag", "database"]

[project.urls]
Homepage = "https://github.com/Cairn-DB/cairn"
Repository = "https://github.com/Cairn-DB/cairn"
Issues = "https://github.com/Cairn-DB/cairn/issues"
Changelog = "https://github.com/Cairn-DB/cairn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
