[package]
name = "cairn-server"
description = "Cairn node binary: thread-per-core runtime, shard placement, client API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[dependencies]
cairn-core = { path = "../cairn-core" }
cairn-storage = { path = "../cairn-storage" }
cairn-index = { path = "../cairn-index" }
cairn-query = { path = "../cairn-query" }
cairn-raft = { path = "../cairn-raft" }
cairn-runtime = { path = "../cairn-runtime" }
cairn-proto = { path = "../cairn-proto" }
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
cairn-client = { path = "../cairn-client" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
base64 = "0.22"
mimalloc = { version = "0.1", default-features = false }
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
