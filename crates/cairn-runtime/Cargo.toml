[package]
name = "cairn-runtime"
description = "Per-core executor with pluggable reactors, and the real (OS-backed) Clock/Disk/Network implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cairn-core = { path = "../cairn-core" }
bytes.workspace = true
memmap2.workspace = true
libc = "0.2"
slab.workspace = true
thiserror.workspace = true
tracing.workspace = true
# mTLS between nodes (ADR 0018): rustls with the ring backend (no cmake), webpki for node identity.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
rcgen = "0.13"
proptest.workspace = true
loom.workspace = true
