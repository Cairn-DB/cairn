name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, requests, schema. For cluster bugs, a simulator seed if you have one.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Nodes, shards, flags, OS, Docker or binary, hardware.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
