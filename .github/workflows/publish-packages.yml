# Publishes the clients and integrations to PyPI and npm, from a release tag, by hand
# (Actions -> publish-packages -> Run workflow, choosing the tag).
#
# One-time setup, by the owner (docs/releasing.md, "Packages"):
# - PyPI: a trusted publisher for each project: repository Cairn-DB/cairn, workflow
#   publish-packages.yml, and environment "pypi" (cairn-db-client), "pypi-langchain"
#   (langchain-cairn) or "pypi-llamaindex" (llama-index-vector-stores-cairn). No token is stored.
# - npm: the organization "cairn-db", and a granular automation token with publish rights on
#   @cairn-db/*, stored as the repository secret NPM_TOKEN. Packages are published with
#   provenance.
name: publish-packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - name: Package versions match the tag
        run: |
          v="${{ inputs.tag }}"; v="${v#v}"
          grep -q "^version = \"$v\"" clients/python/pyproject.toml
          grep -q "^version = \"$v\"" integrations/langchain-cairn/pyproject.toml
          grep -q "^version = \"$v\"" integrations/llama-index-vector-stores-cairn/pyproject.toml
          grep -q "\"version\": \"$v\"" clients/typescript/package.json
          grep -q "\"version\": \"$v\"" integrations/langchain-js/package.json
  # One job and one GitHub environment per project: PyPI refuses two pending publishers with
  # the same repository, workflow and environment, whatever the project name.
  pypi:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: clients/python, env: pypi }
          - { dir: integrations/langchain-cairn, env: pypi-langchain }
          - { dir: integrations/llama-index-vector-stores-cairn, env: pypi-llamaindex }
    environment: ${{ matrix.env }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install build && python -m build "${{ matrix.dir }}" --outdir dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/ }
  npm:
    needs: versions
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - name: "@cairn-db/client"
        working-directory: clients/typescript
        run: npm ci && npm run build && npm publish --access public --provenance
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - name: "@cairn-db/langchain"
        working-directory: integrations/langchain-js
        # Depends on the client just published, not on the local path.
        run: |
          v=$(node -p 'require("./package.json").version')
          for i in $(seq 30); do npm view "@cairn-db/client@$v" version && break; sleep 10; done
          npm pkg set "devDependencies.@cairn-db/client=$v"
          npm install --no-audit --no-fund && npm run build && npm publish --access public --provenance
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
