name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  # TypeScript and Python clients (ADR 0031): unit tests, then live tests against a fresh node,
  # on the oldest and the newest supported runtimes.
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { node: "18", python: "3.9" }
          - { node: "22", python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: clients/typescript/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install "httpx>=0.24" pytest
      - run: cd clients/typescript && npm ci --no-audit --no-fund
      - run: clients/test-live.sh
  # Deterministic simulation: replicas, crashes, partitions, snapshots, takedowns.
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/scripts/campaign.sh 1000 4 campaign.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: campaign, path: "campaign.md\ndata/campaign/*.log" }
