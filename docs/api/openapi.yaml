openapi: 3.1.0
info:
  title: Cairn HTTP API
  version: "0.2-dev"
  description: >
    Hybrid search (vectors, BM25, filters) with a deletion guarantee: a takedown is final for
    any read that passes its consistency token as `after`. See docs/api/http.md, ADR 0023 and,
    for API keys and roles, ADR 0030.
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://localhost:7200
security:
  - apiKey: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
  /v1/schema:
    get:
      summary: The collection schema
      responses:
        "200": { description: Schema, content: { application/json: { schema: { type: object } } } }
  /v1/status:
    get:
      summary: Replicas hosted by the node answering
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  replicas: { type: array, items: { $ref: "#/components/schemas/ReplicaStatus" } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/merges:
    get:
      summary: Merge pause state of the node answering
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/Merges" } } } }
    post:
      summary: Pause or resume merges on the node answering (running and committed merges complete)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Merges" } } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/Merges" } } } }
  /v1/documents:
    post:
      summary: Insert or replace documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Document" } }
                after: { $ref: "#/components/schemas/Token" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/documents/delete:
    post:
      summary: Take documents down, by id or by filter
      description: >
        With `ids` only, removes those documents. With a `filter`, removes the documents that
        match it when each shard applies the deletion (ADR 0031), restricted to `ids` when
        given, and answers with the number removed. A filter matching every document is
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Id" } }
                filter: { $ref: "#/components/schemas/Filter" }
                after: { $ref: "#/components/schemas/Token" }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: Ids given (deletion by id) }
                  deleted: { type: integer, description: Documents removed (deletion by filter) }
                  consistency_token: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Digits are an integer id unless `id_type=text`.
        schema: { type: string }
      - name: id_type
        in: query
        schema: { type: string, enum: [text, int] }
    get:
      summary: Read one document
      parameters:
        - { $ref: "#/components/parameters/Consistency" }
        - { $ref: "#/components/parameters/After" }
      responses:
        "200": { description: The document, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take one document down
      parameters:
        - { $ref: "#/components/parameters/After" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
  /v1/search:
    post:
      summary: Hybrid search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Search" }
      responses:
        "200":
          description: Hits, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/Hit" } }
        "400": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >
        An API key (ADR 0030). Roles: read (reads, search, schema), write (upserts), takedown
        (deletions), admin (status, merge pause, and everything else). 401 without a valid key,
        403 without the role.
  parameters:
    Consistency:
      name: consistency
      in: query
      schema: { $ref: "#/components/schemas/Consistency" }
    After:
      name: after
      in: query
      schema: { $ref: "#/components/schemas/Token" }
  responses:
    Ack:
      description: Written
      content:
        application/json:
          schema:
            type: object
            properties:
              count: { type: integer }
              consistency_token: { $ref: "#/components/schemas/Token" }
    Error:
      description: Error
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
  schemas:
    Token:
      type: string
      description: Opaque consistency token (`shard.index,...`). Pass it back as `after`.
    Consistency:
      type: string
      enum: [linearizable, read_your_writes, stale]
    Id:
      description: An integer below 2^63, or your own text id of 1 to 1024 bytes (ADR 0031).
      oneOf:
        - { type: integer, minimum: 0, maximum: 9223372036854775807 }
        - { type: string, minLength: 1, maxLength: 1024 }
    Document:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/Id" }
      additionalProperties: true
      description: Fields keyed by schema name; see docs/api/http.md for the JSON type of each kind.
    Filter:
      type: object
      description: >
        {"and": [Filter]}, {"or": [Filter]}, {"not": Filter}, or
        {"field": name, eq|in|gt|gte|lt|lte|is_null: value}.
    Search:
      type: object
      properties:
        k: { type: integer, minimum: 1, maximum: 10000, default: 10 }
        vector: { $ref: "#/components/schemas/VectorLeg" }
        vectors: { type: array, items: { $ref: "#/components/schemas/VectorLeg" } }
        text:
          type: object
          required: [field, query]
          properties:
            field: { type: string }
            query: { type: string }
            all_terms: { type: boolean, default: false }
        filter: { $ref: "#/components/schemas/Filter" }
        fusion:
          oneOf:
            - { type: object, properties: { rrf: { type: object, properties: { k: { type: number } } } } }
            - { type: object, properties: { weighted: { type: array, items: { type: number } } } }
        oversample: { type: integer, minimum: 1, maximum: 64 }
        with_documents: { type: boolean, default: true }
        consistency: { $ref: "#/components/schemas/Consistency" }
        after: { $ref: "#/components/schemas/Token" }
    VectorLeg:
      type: object
      required: [field, values]
      properties:
        field: { type: string }
        values: { type: array, items: { type: number } }
        ef: { type: integer, minimum: 0, default: 0 }
    Hit:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        score: { type: number }
        legs:
          type: array
          items:
            oneOf:
              - type: "null"
              - { type: object, properties: { rank: { type: integer }, score: { type: number } } }
        document: { $ref: "#/components/schemas/Document" }
    ReplicaStatus:
      type: object
      properties:
        node: { type: integer }
        role: { type: string, enum: [follower, precandidate, candidate, leader] }
        term: { type: integer }
        leader: { type: [integer, "null"] }
        commit: { type: integer }
        applied: { type: integer }
        live_docs: { type: integer }
        memtable_bytes: { type: integer }
        raft_log_bytes: { type: integer }
        segments: { type: array, items: { type: integer } }
        segments_built: { type: integer }
        segments_fetched: { type: integer }
        pending: { type: integer }
        merges_running: { type: integer }
        merges_pending: { type: integer }
        merges_paused: { type: boolean }
    Merges:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }
